<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Header icons, named</title>
  <style>
    .header__icon { display: inline-flex; min-width: 24px; min-height: 24px; background: none; border: 0; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
      white-space: nowrap; border: 0;
    }
    :focus-visible { outline: 3px solid #121212; outline-offset: 2px; }
  </style>
</head>
<body>
  <header class="header">
    <!-- Visually hidden text rather than aria-label: it is translated by
         browser page translation, it survives an icon set that fails to load,
         and voice control users can say what they can read. -->
    <button type="button" class="header__icon">
      <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 20 20">
        <circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="2"></circle>
        <path d="M13.5 13.5 18 18" stroke="currentColor" stroke-width="2"></path>
      </svg>
      <span class="visually-hidden">Search</span>
    </button>

    <button type="button" class="header__icon" aria-controls="CartDrawer" aria-expanded="false">
      <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 20 20">
        <path d="M3 5h14l-1.5 10H4.5Z" fill="none" stroke="currentColor" stroke-width="2"></path>
      </svg>
      <span class="visually-hidden">Open cart, 2 items</span>
    </button>
  </header>
</body>
</html>
