<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sale price conveyed visually only</title>
  <style>
    .price--sale { color: #b00020; font-weight: 600; }
    :focus-visible { outline: 3px solid #121212; outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>Wool throw</h1>

  <!-- A strikethrough is a visual convention. A screen reader does not announce
       a line through a number, so this is read as "eighteen pounds twenty-four
       pounds" with nothing to say which is which. The red is the other half of
       the same problem: colour is doing the work on its own. -->
  <p class="price">
    <span class="price--sale">18.00</span>
    <s>24.00</s>
  </p>
</body>
</html>
