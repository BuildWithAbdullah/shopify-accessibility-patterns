<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Pinch zoom disabled. This line is copied into theme after theme to stop
       iOS zooming when a form field takes focus, and the cost is that nobody
       can enlarge anything on the store. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Zoom disabled</title>
  <style>
    :focus-visible { outline: 3px solid #121212; outline-offset: 2px; }
    .price { font-size: 0.75rem; }
  </style>
</head>
<body>
  <h1>Wool throw</h1>
  <p class="price">24.00</p>
</body>
</html>
